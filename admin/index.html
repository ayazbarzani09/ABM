<!doctype html>
<html lang="ckb" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>ABM | ئەدمین</title>
<style>
:root{--bg:#08090b;--panel:#121216;--gold:#d6ad32;--gold2:#f4d36c;--line:#55421c;--muted:#aaa397}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#3a2b13,transparent 48%),var(--bg);color:#f7f3e9;font-family:Tahoma,Arial,sans-serif;line-height:1.8;min-height:100vh}main{width:min(900px,calc(100% - 30px));margin:30px auto}.brand{text-align:center;color:var(--gold2);font-size:38px;font-weight:900;letter-spacing:5px;text-shadow:0 0 25px #d6ad3266}.brand:before{content:"♛";display:block;font-size:40px;line-height:1.1}h1{text-align:center;font-size:26px;margin:5px 0 25px;color:#f1eee7}h2{font-size:19px;color:var(--gold2)}.panel{background:linear-gradient(145deg,#191710,#101114);border:1px solid var(--line);padding:24px;border-radius:12px;margin:18px 0;box-shadow:0 12px 35px #0005}label{display:block;margin:10px 0 4px;color:#d8d1c4}input,textarea{width:100%;padding:11px 13px;background:#090909;border:1px solid #51401f;border-radius:7px;color:white;font:inherit;outline:none}input:focus,textarea:focus{border-color:var(--gold2);box-shadow:0 0 0 2px #d6ad3222}textarea{min-height:75px;resize:vertical}button{font:inherit;cursor:pointer;background:linear-gradient(110deg,#f4d36c,#bd8d20);color:#111;border:0;border-radius:25px;padding:10px 21px;font-weight:bold;margin-top:12px}button.secondary{background:transparent;color:var(--gold2);border:1px solid var(--gold)}button.danger{background:#702b2b;color:white;margin:0;padding:6px 12px}.error{color:#ff9d9d}.success{color:#b7e6b8}.hidden{display:none}.muted,small{color:var(--muted)}.admin{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.back{display:block;text-align:center;margin:24px;color:var(--gold2)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.toplinks{display:flex;justify-content:center;gap:12px;margin:12px auto 22px;flex-wrap:wrap}.toplinks a{border:1px solid var(--gold);border-radius:25px;padding:7px 15px;color:var(--gold2)}@media(max-width:600px){.grid{grid-template-columns:1fr}.panel{padding:17px}}
</style></head><body><main><div class="brand">A.B.M</div><h1>بەڕێوەبردنی ماڵپەڕ</h1><div class="toplinks"><a href="/">⌂ Home</a><a href="/#about">♟ About</a><a href="/#work">⚙ Services</a></div>
<section id="login" class="panel"><h2>چوونە ژوورەوە</h2><form id="loginForm"><label>ناوی بەکارهێنەر</label><input name="username" autocomplete="username" required><label>وشەی نهێنی</label><input name="password" type="password" autocomplete="current-password" required><button>چوونە ژوورەوە</button></form><p id="loginMsg" class="error"></p></section>
<section id="dashboard" class="hidden"><div class="panel"><span>بەخێربێیت، <b id="who"></b></span> <button class="secondary" id="logout">چوونەدەرەوە</button></div>
<form id="contentForm" class="panel"><h2>دەستکاریکردنی ناوەڕۆکی سایت</h2><h2>وێنەی پاشبنەمای سەرەکی</h2><p class="muted">وێنەیەک هەڵبژێرە بۆ پاشبنەمای بەشی سەرەوەی سایت (JPG، PNG، WEBP، GIF — تا ٢MB).</p><input id="heroImageFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><button type="button" id="uploadImage">بارکردنی وێنە</button><p id="imageMsg"></p>
<label>ناونیشانی سەرەکی</label><input name="heroTitle" required><label>دەقی سەرەکی</label><textarea name="heroText"></textarea>
<label>ناونیشانی دەربارە</label><input name="aboutTitle"><label>دەقی دەربارە</label><textarea name="aboutText"></textarea>
<label>ناونیشانی بەشی کارەکان</label><input name="workTitle"><div class="grid">
<div><label>ناونیشانی کار ١</label><input name="card1Title"><label>دەقی کار ١</label><textarea name="card1Text"></textarea></div>
<div><label>ناونیشانی کار ٢</label><input name="card2Title"><label>دەقی کار ٢</label><textarea name="card2Text"></textarea></div>
<div><label>ناونیشانی کار ٣</label><input name="card3Title"><label>دەقی کار ٣</label><textarea name="card3Text"></textarea></div></div>
<label>ناونیشانی پەیوەندی</label><input name="contactTitle"><label>دەقی پەیوەندی</label><textarea name="contactText"></textarea><label>ئیمەیڵ</label><input name="email" type="email"><button type="submit">پاشەکەوتکردنی گۆڕانکارییەکان</button><p id="saveMsg"></p></form>
<div id="ownerPanel" class="panel hidden"><h2>زیادکردنی ئەدمینی نوێ</h2><form id="addForm"><label>ناوی ئەدمین (ئینگلیزی)</label><input name="username" minlength="3" maxlength="32" pattern="[a-zA-Z0-9_.-]+" required><label>وشەی نهێنی (١٢ پیت یان زیاتر)</label><input name="password" type="password" minlength="12" required><button>زیادکردن</button></form><p id="addMsg"></p><h2>ئەدمینەکان</h2><div id="admins"></div></div></section><a class="back" href="/">گەڕانەوە بۆ سایت</a>
<script>
const endpoint='/.netlify/functions/admin';async function api(action,data){const r=await fetch(endpoint+'?action='+action,{method:['me','list','content'].includes(action)?'GET':'POST',headers:{'content-type':'application/json'},body:['me','list','content'].includes(action)?undefined:JSON.stringify(data||{})});const j=await r.json();if(!r.ok)throw new Error(j.error||'هەڵە ڕوویدا');return j}
function msg(id,t,cls='error'){const e=document.getElementById(id);e.textContent=t;e.className=cls}
async function listAdmins(){const d=await api('list');const root=document.getElementById('admins');root.innerHTML='';d.admins.forEach(a=>{const row=document.createElement('div');row.className='admin';const s=document.createElement('span');s.textContent=a.username+(a.role==='owner'?' — خاوەن':' — ئەدمین');row.append(s);if(a.role!=='owner'){const b=document.createElement('button');b.className='danger';b.textContent='سڕینەوە';b.onclick=async()=>{if(confirm('دڵنیایت؟')){try{await api('remove',{id:a.id});await listAdmins()}catch(e){alert(e.message)}}};row.append(b)}root.append(row)})}
async function load(){try{const d=await api('me');document.getElementById('login').classList.add('hidden');document.getElementById('dashboard').classList.remove('hidden');document.getElementById('who').textContent=d.user.username;const c=await api('content');for(const [k,v] of Object.entries(c.content)){const f=document.querySelector('[name="'+k+'"]');if(f)f.value=v}if(d.user.role==='owner'){document.getElementById('ownerPanel').classList.remove('hidden');await listAdmins()}}catch(e){}}
document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await api('login',{username:f.get('username'),password:f.get('password')});msg('loginMsg','');await load()}catch(x){msg('loginMsg',x.message)}};
document.getElementById('uploadImage').onclick=async()=>{const file=document.getElementById('heroImageFile').files[0];if(!file){msg('imageMsg','تکایە سەرەتا وێنەیەک هەڵبژێرە.');return}if(file.size>2*1024*1024){msg('imageMsg','قەبارەی وێنە دەبێت کەمتر لە ٢MB بێت.');return}const reader=new FileReader();reader.onload=async()=>{try{const data=String(reader.result).split(',')[1];await api('save-image',{type:file.type,data});msg('imageMsg','وێنەکە بە سەرکەوتوویی بارکرا. سایتەکە نوێ بکەرەوە.','success')}catch(x){msg('imageMsg',x.message)}};reader.readAsDataURL(file)};\ndocument.getElementById('contentForm').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));try{await api('save-content',data);msg('saveMsg','گۆڕانکارییەکان پاشەکەوت کران.','success')}catch(x){msg('saveMsg',x.message)}};
document.getElementById('addForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await api('add',{username:f.get('username'),password:f.get('password')});e.target.reset();msg('addMsg','ئەدمین زیاد کرا.','success');await listAdmins()}catch(x){msg('addMsg',x.message)}};
document.getElementById('logout').onclick=async()=>{await api('logout');location.reload()};load();
</script></main></body></html>
